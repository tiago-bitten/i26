name: unlist

# Unlisting is not deleting — nuget.org has no delete. The version stops showing in search and stops
# being what "latest" resolves to; anyone who asks for it by number still restores it.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated package ids, or "all" for the six in this repository'
        required: true
      version:
        description: "Version to unlist, e.g. 0.1.0-rc.1"
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ALL_PACKAGES: i26.Core,i26.Cqrs,i26.EntityFrameworkCore,i26.Dapper,i26.Hosting,i26.AspNetCore

jobs:
  unlist:
    name: unlist ${{ inputs.version }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Same trade as the release: an OIDC token for a key that lives an hour. It needs a trusted
      # publishing policy of its own on nuget.org, because a policy names one workflow file.
      id-token: write

    steps:
      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check the publisher is configured
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::NUGET_USER is not set."
            exit 1
          fi

      - name: Sign in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # --non-interactive, or the command waits on a confirmation nobody is there to give.
      - name: Unlist
        env:
          PACKAGES: ${{ inputs.packages }}
          VERSION: ${{ inputs.version }}
          API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          if [ "$PACKAGES" = "all" ]; then PACKAGES="$ALL_PACKAGES"; fi

          echo "$PACKAGES" | tr ',' '\n' | while read -r package; do
            package="$(echo "$package" | xargs)"
            [ -z "$package" ] && continue

            echo "::group::$package $VERSION"
            dotnet nuget delete "$package" "$VERSION" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$API_KEY" \
              --non-interactive
            echo "::endgroup::"
          done
